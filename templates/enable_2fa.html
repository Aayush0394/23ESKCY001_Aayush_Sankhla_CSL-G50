{% extends "base.html" %}
{% block title %}Enable 2FA | CSL-G50{% endblock %}
{% block content %}
<div class="card shadow">
    <div class="card-header text-center py-3">
        <h4 class="mb-0">Enable Two-Factor Authentication</h4>
    </div>
    <div class="card-body p-4 text-center">
        <p>Scan this QR code with <strong>Google Authenticator</strong>, Authy, or any TOTP app:</p>
        
        <div class="qr-box mb-3">
            <img src="data:image/png;base64,{{ qr_b64 }}" alt="QR Code" width="200" height="200">
        </div>

        <p class="small text-muted">Or enter this secret key manually:</p>
        <code class="d-block mb-4 p-2 rounded" style="background:#f1f5f9; color:#0f172a;">{{ secret }}</code>

        <form method="POST">
            <div class="mb-3 text-start">
                <label class="form-label">Enter the 6-digit code shown in your app to confirm:</label>
                <input type="text" name="code" class="form-control text-center fs-4" 
                       maxlength="6" placeholder="000000" required autofocus
                       style="letter-spacing: 4px;">
            </div>
            <button type="submit" class="btn btn-primary w-100">Confirm &amp; Enable 2FA</button>
        </form>
        <div class="mt-3">
            <a href="{{ url_for('dashboard') }}" class="text-muted small">Cancel</a>
        </div>
    </div>
</div>
{% endblock %}
